services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dynamicdb
      POSTGRES_USER: dynamic
      POSTGRES_PASSWORD: dynamic
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamic -d dynamicdb"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/dynamicdb
      DB_USERNAME: dynamic
      DB_PASSWORD: dynamic
      EXTERNAL_PERCENTAGE_FIXED: 10
      EXTERNAL_PERCENTAGE_FAIL: "false"
      PORT: 8080
    ports:
      - "18080:8080"
volumes:
  dbdata:
