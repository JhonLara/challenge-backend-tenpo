spring:
  application:
    name: dynamic-percentage-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dynamicdb}
    username: ${DB_USERNAME:dynamic}
    password: ${DB_PASSWORD:dynamic}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
    show-sql: false
  jackson:
    time-zone: UTC

external:
  percentage:
    fixed: ${EXTERNAL_PERCENTAGE_FIXED:10}
    fail: ${EXTERNAL_PERCENTAGE_FAIL:false}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
